[project]
name = "vibegraph-backend"
version = "0.1.0"
description = "Hour 1 streaming agent host for VibeGraph"
requires-python = ">=3.11"
dependencies = [
    "ag-ui-langgraph>=0.0.43",
    "ag-ui-protocol>=0.1.20",
    "fastapi>=0.115.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
